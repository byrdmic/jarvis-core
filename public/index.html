<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Audio Test</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .status { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .connected { background: #e6fffa; color: #006644; }
        .disconnected { background: #fff5f5; color: #c53030; }
        .controls { margin: 20px 0; display: flex; gap: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #log { background: #f7f9fc; padding: 15px; border-radius: 4px; height: 400px; overflow-y: auto; font-family: monospace; }
        .msg-user { color: #2b6cb0; }
        .msg-jarvis { color: #2f855a; }
        .msg-system { color: #718096; font-style: italic; }
    </style>
</head>
<body>
    <h1>Jarvis Audio Test Client</h1>
    
    <div id="status" class="status disconnected">Disconnected</div>

    <div class="controls">
        <button id="btnConnect">Connect</button>
        <button id="btnDisconnect" disabled>Disconnect</button>
    </div>

    <div class="controls">
        <button id="btnRecord" disabled>Hold to Speak</button>
    </div>

    <div id="log"></div>

    <script>
        let ws = null;
        let mediaRecorder = null;
        let audioContext = null;
        let processor = null;
        let inputSource = null;
        let isRecording = false;

        const btnConnect = document.getElementById('btnConnect');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnRecord = document.getElementById('btnRecord');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        function log(msg, type = 'system') {
            const div = document.createElement('div');
            div.className = `msg-${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Audio handling
        // OpenAI expects PCM16 24kHz (or matched to input_audio_format)
        // We'll capture at browser default and downsample if needed, or rely on server to handle it?
        // config.ts says 'pcm16'.
        // We need to convert Float32 (browser) to Int16.

        function floatTo16BitPCM(output, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, input[i]));
                output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
        }

        async function setupAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: {
                    channelCount: 1,
                    sampleRate: 24000, // Try to request 24kHz
                }});
                
                audioContext = new AudioContext({ sampleRate: 24000 });
                inputSource = audioContext.createMediaStreamSource(stream);
                
                // Worklet or ScriptProcessor for raw PCM access
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                processor.onaudioprocess = (e) => {
                    if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
                    
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcm16Buffer = new ArrayBuffer(inputData.length * 2);
                    const view = new DataView(pcm16Buffer);
                    floatTo16BitPCM(view, 0, inputData);
                    
                    // Send raw bytes
                    ws.send(pcm16Buffer);
                };

                inputSource.connect(processor);
                processor.connect(audioContext.destination); // Need to connect to destination for it to run? Or prevent GC.

                log('Audio initialized', 'system');
            } catch (err) {
                log('Error accessing microphone: ' + err.message, 'error');
            }
        }

        btnConnect.onclick = () => {
            const deviceId = 'web-test-' + Math.random().toString(36).substr(2, 9);
            ws = new WebSocket(`ws://${window.location.host}/ws?deviceId=${deviceId}`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusDiv.textContent = `Connected (Device ID: ${deviceId})`;
                statusDiv.className = 'status connected';
                btnConnect.disabled = true;
                btnDisconnect.disabled = false;
                btnRecord.disabled = false;
                log('WebSocket connected');
                setupAudio();
            };

            ws.onclose = () => {
                statusDiv.textContent = 'Disconnected';
                statusDiv.className = 'status disconnected';
                btnConnect.disabled = false;
                btnDisconnect.disabled = true;
                btnRecord.disabled = true;
                log('WebSocket disconnected');
                if (audioContext) audioContext.close();
            };

            ws.onmessage = async (event) => {
                const data = event.data;
                
                if (data instanceof ArrayBuffer) {
                    // Audio data from server
                    // Play it
                    const audioData = data;
                    // Simple playback via decoding (might be latent)
                    // ideally we stream this to a destination
                    try {
                         // Since it's raw PCM16 coming back, we need to convert to AudioBuffer
                         // or use a generator.
                         // For simplicity in this test client, let's assume we can play it.
                         // But decoding raw PCM16 in browser needs manual work.
                         // Let's just log it for now.
                         log(`Received audio chunk: ${data.byteLength} bytes`, 'jarvis');
                         
                         // Basic playback attempt (requires valid header or raw handling)
                         playPcmChunk(data);
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    try {
                        const msg = JSON.parse(data);
                        if (msg.type === 'transcript_delta') {
                            // log(`Transcript: ${msg.text}`, 'jarvis');
                        } else if (msg.type === 'text_delta') {
                            log(`Text: ${msg.text}`, 'jarvis');
                        } else {
                            log(`Message: ${JSON.stringify(msg)}`, 'jarvis');
                        }
                    } catch (e) {
                        log('Received text: ' + data, 'jarvis');
                    }
                }
            };
        };

        btnDisconnect.onclick = () => {
            if (ws) ws.close();
        };

        btnRecord.onmousedown = () => {
            isRecording = true;
            btnRecord.textContent = 'Recording...';
            log('Recording started...', 'system');
        };

        btnRecord.onmouseup = () => {
            isRecording = false;
            btnRecord.textContent = 'Hold to Speak';
            log('Recording stopped.', 'system');
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'commit' }));
                log('Sent commit signal', 'system');
            }
        };

        // Simple PCM player
        // Note: This accumulates delay. Real implementation should use AudioWorklet.
        function playPcmChunk(arrayBuffer) {
            if (!audioContext) return;
            
            // Convert Int16 ArrayBuffer to Float32
            const int16 = new Int16Array(arrayBuffer);
            const float32 = new Float32Array(int16.length);
            for(let i=0; i<int16.length; i++) {
                float32[i] = int16[i] / 32768.0;
            }

            const buffer = audioContext.createBuffer(1, float32.length, 24000);
            buffer.getChannelData(0).set(float32);
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start();
        }
    </script>
</body>
</html>
